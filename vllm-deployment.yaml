apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpu
  namespace: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-cpu
  template:
    metadata:
      labels:
        app: llama-cpu
    spec:
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server
          args:
            - "--model"
            - "/models/tinyllama.gguf"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "--metrics"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: model-volume
              mountPath: /models
          resources:
            requests:
              cpu: "2"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "4Gi"
      volumes:
        - name: model-volume
          hostPath:
            path: /models
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: llama-cpu
  namespace: inference
  labels:
    app: llama-cpu
spec:
  selector:
    app: llama-cpu
  ports:
    - port: 8080
      targetPort: 8080
      name: http
